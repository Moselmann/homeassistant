blueprint:
  name: IKEA E2213 SOMRIG Shortcut Button (Zigbee2MQTT)
  author: Moselmann
  description: |
    ## Control anything with the IKEA SOMRIG shortcut button

    Only for use with Zigbee2MQTT ([MQTT](https://www.home-assistant.io/integrations/mqtt)
    + [Z2M add-on](https://www.zigbee2mqtt.io/guide/installation/03_ha_addon.html)).
    The Home Assistant integration has to be enabled in Zigbee2MQTT, because it
    publishes the button events to `<base topic>/<remote name>/action`.

    Available controls for **dots 1** and **dots 2**:

    - **Single press**
    - **Double press**
    - **Hold**: the hold action(s) are repeated every **Hold delay**, at most
      **Max number of loops** times, until the button is released.
    - **Release** after holding, e.g. to stop a cover.

    A new button event cancels actions that are still running, so releasing
    a held button always stops the hold loop immediately.

    Adapted from https://gist.github.com/damru/b2c1c780ffb0ddc084952eb89db9573a
    (forked from https://gist.github.com/amorfinvdev/ece1a0873759f908429a5c01c8426dce).

    Version: 20261005
  source_url: https://github.com/Moselmann/homeassistant/blob/main/blueprints/zigbee2mqtt_ikea_e2213_somrig_shortcut_button.yaml
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    zigbee2mqtt:
      name: Zigbee2MQTT
      icon: mdi:remote
      input:
        remote_name:
          name: Remote name
          description: >-
            The friendly name of the button in Zigbee2MQTT (case-sensitive),
            e.g. `Somrig Living Room`.
          selector:
            text: {}
        base_topic:
          name: Base MQTT topic
          description: The [base topic](https://www.zigbee2mqtt.io/guide/configuration/mqtt.html) configured in Zigbee2MQTT.
          default: zigbee2mqtt
          selector:
            text: {}
    dots_1:
      name: Dots 1 (•)
      icon: mdi:numeric-1-circle-outline
      input:
        dots_1_press_action:
          name: Single press
          description: Action(s) to run when **dots 1** is pressed.
          default: []
          selector:
            action: {}
        dots_1_double_press_action:
          name: Double press
          description: Action(s) to run when **dots 1** is pressed twice.
          default: []
          selector:
            action: {}
        dots_1_hold_action:
          name: Hold
          description: Action(s) to repeat while **dots 1** is held down.
          default: []
          selector:
            action: {}
        dots_1_release_action:
          name: Release after hold
          description: Action(s) to run when **dots 1** is released after holding.
          default: []
          selector:
            action: {}
    dots_2:
      name: Dots 2 (••)
      icon: mdi:numeric-2-circle-outline
      input:
        dots_2_press_action:
          name: Single press
          description: Action(s) to run when **dots 2** is pressed.
          default: []
          selector:
            action: {}
        dots_2_double_press_action:
          name: Double press
          description: Action(s) to run when **dots 2** is pressed twice.
          default: []
          selector:
            action: {}
        dots_2_hold_action:
          name: Hold
          description: Action(s) to repeat while **dots 2** is held down.
          default: []
          selector:
            action: {}
        dots_2_release_action:
          name: Release after hold
          description: Action(s) to run when **dots 2** is released after holding.
          default: []
          selector:
            action: {}
    hold_settings:
      name: Hold settings
      icon: mdi:timer-cog-outline
      collapsed: true
      input:
        helper_hold_delay:
          name: Hold delay
          description: >-
            Minimum time between two runs of the hold action(s). If the
            action(s) take longer, the next run starts once they are done.
          default: 250
          selector:
            number:
              unit_of_measurement: ms
              min: 100
              max: 5000
              step: 10
              mode: slider
        helper_max_loops:
          name: Max number of loops
          description: Maximum number of hold action runs while a button is held.
          default: 20
          selector:
            number:
              min: 1
              max: 1000
              step: 1
              mode: box

# restart: the release event cancels the running hold loop, and a press of
# the other button is never dropped while an action is still running.
mode: restart

trigger_variables:
  z2m_base_topic: !input base_topic
  z2m_controller: !input remote_name

triggers:
  - trigger: mqtt
    topic: "{{ z2m_base_topic ~ '/' ~ z2m_controller ~ '/action' }}"
    payload: 1_short_release
    id: dots_1_press
  - trigger: mqtt
    topic: "{{ z2m_base_topic ~ '/' ~ z2m_controller ~ '/action' }}"
    payload: 1_double_press
    id: dots_1_double_press
  - trigger: mqtt
    topic: "{{ z2m_base_topic ~ '/' ~ z2m_controller ~ '/action' }}"
    payload: 1_long_press
    id: dots_1_hold
  - trigger: mqtt
    topic: "{{ z2m_base_topic ~ '/' ~ z2m_controller ~ '/action' }}"
    payload: 1_long_release
    id: dots_1_release
  - trigger: mqtt
    topic: "{{ z2m_base_topic ~ '/' ~ z2m_controller ~ '/action' }}"
    payload: 2_short_release
    id: dots_2_press
  - trigger: mqtt
    topic: "{{ z2m_base_topic ~ '/' ~ z2m_controller ~ '/action' }}"
    payload: 2_double_press
    id: dots_2_double_press
  - trigger: mqtt
    topic: "{{ z2m_base_topic ~ '/' ~ z2m_controller ~ '/action' }}"
    payload: 2_long_press
    id: dots_2_hold
  - trigger: mqtt
    topic: "{{ z2m_base_topic ~ '/' ~ z2m_controller ~ '/action' }}"
    payload: 2_long_release
    id: dots_2_release

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: dots_1_press
        sequence: !input dots_1_press_action
      - conditions:
          - condition: trigger
            id: dots_1_double_press
        sequence: !input dots_1_double_press_action
      - conditions:
          - condition: trigger
            id: dots_1_hold
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence: !input dots_1_hold_action
                    - delay:
                        milliseconds: !input helper_hold_delay
      - conditions:
          - condition: trigger
            id: dots_1_release
        sequence: !input dots_1_release_action
      - conditions:
          - condition: trigger
            id: dots_2_press
        sequence: !input dots_2_press_action
      - conditions:
          - condition: trigger
            id: dots_2_double_press
        sequence: !input dots_2_double_press_action
      - conditions:
          - condition: trigger
            id: dots_2_hold
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence: !input dots_2_hold_action
                    - delay:
                        milliseconds: !input helper_hold_delay
      - conditions:
          - condition: trigger
            id: dots_2_release
        sequence: !input dots_2_release_action
